services:
  - type: web
    name: ecoprompt
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: ECOPROMPT_ADMIN_KEY
        generateValue: true
